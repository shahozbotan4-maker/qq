<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال تفاعلي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fdf2f8; /* لون خلفية هادئ */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* لمنع ظهور أشرطة التمرير عند تحرك الزر */
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-align: center;
            z-index: 10;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yes-btn {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #yes-btn:hover {
            background-color: #45a049;
        }

        #no-btn {
            background-color: #f44336;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        /* رسالة النجاح المخفية في البداية */
        #success-msg {
            display: none;
            font-size: 3rem;
            color: #e91e63;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 id="question">هل رح تعزمني اليوم؟</h1>

    <div class="buttons-container" id="buttons">
        <button id="yes-btn" onclick="sayYes()">نعم</button>
        <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()">لا</button>
    </div>

    <div id="success-msg">كريم وبالكرم معروف! 🎉</div>

    <script>
        let yesScale = 1;
        let noScale = 1;

        function moveNoButton() {
            const noBtn = document.getElementById("no-btn");
            const yesBtn = document.getElementById("yes-btn");

            // تغيير الحجم بنسبة 0.5 (تكبير نعم وتصغير لا)
            yesScale += 0.1;
            noScale *= 0.99;

            // تطبيق الحجم الجديد
            yesBtn.style.transform = `scale(${yesScale})`;
            noBtn.style.transform = `scale(${noScale})`;

            // حساب أبعاد الشاشة للحصول على موقع عشوائي لزر "لا"
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;

            // تحديد إحداثيات عشوائية
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // تغيير مكان زر لا ليكون حراً في الشاشة (fixed)
            noBtn.style.position = "fixed";
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        function sayYes() {
            // إخفاء السؤال والأزرار وعرض رسالة النجاح
            document.getElementById("question").style.display = "none";
            document.getElementById("buttons").style.display = "none";
            
            // إخفاء زر لا في حال كان ثابتاً في مكان آخر بالشاشة
            document.getElementById("no-btn").style.display = "none";
            
            document.getElementById("success-msg").style.display = "block";
        }
    </script>

</body>
</html>
